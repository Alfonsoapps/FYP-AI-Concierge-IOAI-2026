services:
  - type: web
    name: ioai-2027-concierge
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
