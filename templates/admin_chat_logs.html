<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Logs - Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0c0c1d; color: #e8e8f0; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .page-header { margin-bottom: 24px; }
        .page-header h1 {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .page-header p { font-size: 0.86rem; color: #8080a0; }

        /* Stats */
        .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat-card { flex: 1; min-width: 120px; background: rgba(14,14,32,0.9);
            border: 1px solid rgba(124,58,237,0.15); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 700; color: #a78bfa; }
        .stat-label { font-size: 0.66rem; color: #8080a0; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }

        /* Log cards */
        .log-list { display: flex; flex-direction: column; gap: 12px; }
        .log-card {
            background: rgba(14,14,32,0.9); border: 1px solid rgba(124,58,237,0.12);
            border-radius: 14px; padding: 18px 20px; transition: border-color 0.2s ease;
        }
        .log-card:hover { border-color: rgba(124,58,237,0.3); }
        .log-card.flagged { border-color: rgba(239,68,68,0.3); }

        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .log-user { font-size: 0.84rem; font-weight: 600; color: #e8e8f0; }
        .log-time { font-size: 0.7rem; color: #606080; }

        .log-question { font-size: 0.86rem; color: #b0b0c8; margin-bottom: 8px; padding: 10px 12px;
            background: rgba(124,58,237,0.06); border-radius: 8px; border-left: 3px solid #7c3aed; }
        .log-response { font-size: 0.84rem; color: #8080a0; line-height: 1.5; margin-bottom: 10px;
            padding: 10px 12px; background: rgba(255,255,255,0.02); border-radius: 8px; }

        .log-meta { display: flex; gap: 12px; flex-wrap: wrap; }
        .log-meta-item { font-size: 0.7rem; color: #606080; display: flex; align-items: center; gap: 4px; }

        .guardrail-badge { font-size: 0.64rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
        .guardrail-pass { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #10b981; }
        .guardrail-flag { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #ef4444; }
        .guardrail-na { background: rgba(128,128,160,0.1); border: 1px solid rgba(128,128,160,0.2); color: #8080a0; }
    </style>
</head>
<body>
    <div class="admin-layout">
        {% include 'partials/admin_sidebar.html' %}
        <div class="admin-main">
            <div class="page-header">
                <h1>Chat Logs</h1>
                <p>Monitor participant conversations with the AI concierge.</p>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-num" id="stat-total">47</div>
                    <div class="stat-label">Total Chats</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-today">12</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-avg">1.8s</div>
                    <div class="stat-label">Avg Response</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-flagged">2</div>
                    <div class="stat-label">Flagged</div>
                </div>
            </div>

            <!-- Log entries -->
            <div class="log-list" id="log-list"></div>
        </div>
    </div>

    <script>
        async function loadLogs() {
            try {
                const res = await fetch('/api/admin/chat-logs');
                const data = await res.json();

                // Update stats
                const stats = data.stats || {};
                document.getElementById('stat-total').textContent = stats.total_conversations || 0;
                document.getElementById('stat-today').textContent = stats.today || 0;
                document.getElementById('stat-flagged').textContent = stats.with_files || 0;
                // Calculate avg response time from logs
                const logs = data.logs || [];
                if (logs.length > 0) {
                    const avgMs = logs.reduce((sum, l) => sum + (l.response_time_ms || 0), 0) / logs.length;
                    document.getElementById('stat-avg').textContent = (avgMs / 1000).toFixed(1) + 's';
                } else {
                    document.getElementById('stat-avg').textContent = '–';
                }

                // Update stat labels
                document.querySelector('#stat-flagged').closest('.stat-card').querySelector('.stat-label').textContent = 'With Files';

                renderLogs(logs);
            } catch (e) {
                document.getElementById('log-list').innerHTML = '<div style="text-align:center;padding:40px;color:#606080;">Could not load chat logs.</div>';
            }
        }

        function renderLogs(logs) {
            const list = document.getElementById('log-list');

            if (!logs || logs.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#606080;font-size:0.9rem;">No chat logs yet. Conversations will appear here once participants start chatting.</div>';
                return;
            }

            list.innerHTML = logs.map(log => {
                const hasFile = log.has_file ? ' flagged' : '';
                const timeStr = log.timestamp || '';
                const sessionShort = (log.session_id || 'anon').substring(0, 12) + '…';
                const respTime = log.response_time_ms ? (log.response_time_ms / 1000).toFixed(1) + 's' : '–';

                return `
                <div class="log-card${hasFile}">
                    <div class="log-header">
                        <span class="log-user">Session: ${esc(sessionShort)}</span>
                        <span class="log-time">${esc(timeStr)}</span>
                    </div>
                    <div class="log-question">${esc(log.user_message)}</div>
                    <div class="log-response">${esc(log.ai_response).substring(0, 300)}${log.ai_response.length > 300 ? '…' : ''}</div>
                    <div class="log-meta">
                        <span class="log-meta-item">⏱ ${respTime}</span>
                        ${log.filename ? '<span class="guardrail-badge guardrail-flag">📎 ' + esc(log.filename) + '</span>' : '<span class="guardrail-badge guardrail-pass">Text only</span>'}
                    </div>
                </div>`;
            }).join('');
        }

        function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

        loadLogs();
    </script>
</body>
</html>
