<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Singapore - IOAI 2027</title>
    <link rel="stylesheet" href="/static/css/navbar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0c0c1d; color: #e8e8f0; min-height: 100vh; -webkit-font-smoothing: antialiased; padding: 32px 24px 100px; }
        .page-header { max-width: 640px; margin: 0 auto 20px; }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-header p { font-size: 0.88rem; color: #8080a0; }

        .tabs { max-width: 640px; margin: 0 auto 20px; display: flex; gap: 6px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #8080a0; font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .tab-btn:hover { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.3); color: #a78bfa; }
        .tab-btn.active { background: rgba(124,58,237,0.15); border-color: #7c3aed; color: #e8e8f0; }

        .tab-content { display: none; max-width: 640px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: rgba(14,14,32,0.9); border: 1px solid rgba(124,58,237,0.15); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; transition: border-color 0.2s ease; }
        .card:hover { border-color: rgba(124,58,237,0.35); }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .card-desc { font-size: 0.84rem; color: #8080a0; line-height: 1.5; margin-bottom: 10px; }
        .card-badge { display: inline-block; font-size: 0.64rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.2); color: #a78bfa; margin-right: 6px; }
        .card-badge.completed { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: #10b981; }

        .btn-complete { padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); color: #10b981; font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .btn-complete:hover { background: rgba(16,185,129,0.18); border-color: #10b981; color: #fff; }
        .btn-complete.done { opacity: 0.5; pointer-events: none; }

        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .badge-card { text-align: center; padding: 20px 14px; background: rgba(14,14,32,0.9); border: 1px solid rgba(124,58,237,0.12); border-radius: 14px; }
        .badge-card.earned { border-color: rgba(16,185,129,0.4); box-shadow: 0 0 10px rgba(16,185,129,0.1); }
        .badge-icon { font-size: 2rem; margin-bottom: 8px; }
        .badge-name { font-size: 0.76rem; font-weight: 600; color: #a0a0c0; }
        .badge-card.earned .badge-name { color: #10b981; }

        .section-label { font-size: 0.78rem; font-weight: 600; color: #a0a0c0; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 14px; }
        .empty { text-align: center; padding: 40px; color: #505070; font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Explore Singapore</h1>
        <p>Discover culture, food, and local experiences during IOAI 2027.</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="culture">Culture Guide</button>
        <button class="tab-btn" data-tab="challenges">Challenges</button>
        <button class="tab-btn" data-tab="activities">Activities</button>
        <button class="tab-btn" data-tab="badges">My Badges</button>
    </div>

    <div class="tab-content active" id="tab-culture"></div>
    <div class="tab-content" id="tab-challenges"></div>
    <div class="tab-content" id="tab-activities"></div>
    <div class="tab-content" id="tab-badges"></div>

    {% include 'partials/notification_bell.html' %}
    {% include 'partials/navbar.html' %}

    <script>
        const userName = localStorage.getItem('participant_name') || '';

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        async function loadCulture() {
            try {
                const res = await fetch('/api/explore/culture-guide');
                const data = await res.json();
                const el = document.getElementById('tab-culture');
                let html = '';

                html += '<div class="section-label">Cultural Facts</div>';
                (data.facts || []).forEach(f => {
                    html += `<div class="card"><div class="card-title">${esc(f.title)}</div><div class="card-desc">${esc(f.content)}</div></div>`;
                });

                html += '<div class="section-label" style="margin-top:20px;">Food Recommendations</div>';
                (data.food || []).forEach(f => {
                    html += `<div class="card"><div class="card-title">${esc(f.name)}</div><div class="card-desc">${esc(f.description)}</div><span class="card-badge">${esc(f.price_range || '')}</span></div>`;
                });

                html += '<div class="section-label" style="margin-top:20px;">Etiquette Tips</div>';
                (data.etiquette || []).forEach(t => {
                    html += `<div class="card"><div class="card-desc">${esc(t)}</div></div>`;
                });

                el.innerHTML = html || '<div class="empty">No culture guide content yet.</div>';
            } catch(e) { document.getElementById('tab-culture').innerHTML = '<div class="empty">Could not load culture guide.</div>'; }
        }

        async function loadCatalog() {
            try {
                const res = await fetch('/api/explore/catalog');
                const data = await res.json();

                // Challenges
                const chEl = document.getElementById('tab-challenges');
                let chHtml = '';
                (data.challenges || []).forEach(c => {
                    chHtml += `<div class="card"><div class="card-title">${esc(c.title)}</div><div class="card-desc">${esc(c.description)}</div><span class="card-badge">${esc(c.difficulty || 'Easy')}</span><button class="btn-complete" onclick="completeItem('${c.id}')">\u2713 Complete</button></div>`;
                });
                chEl.innerHTML = chHtml || '<div class="empty">No challenges available.</div>';

                // Activities
                const acEl = document.getElementById('tab-activities');
                let acHtml = '';
                (data.activities || []).forEach(a => {
                    acHtml += `<div class="card"><div class="card-title">${esc(a.title)}</div><div class="card-desc">${esc(a.description)}</div><button class="btn-complete" onclick="completeItem('${a.id}')">\u2713 Complete</button></div>`;
                });
                acEl.innerHTML = acHtml || '<div class="empty">No activities available.</div>';
            } catch(e) {}
        }

        async function loadBadges() {
            try {
                const res = await fetch('/api/explore/progress?user=' + encodeURIComponent(userName));
                const data = await res.json();
                const el = document.getElementById('tab-badges');
                const badges = data.badges || [];
                if (badges.length === 0) {
                    el.innerHTML = '<div class="empty">Complete challenges and activities to earn badges!</div>';
                    return;
                }
                let html = '<div class="badge-grid">';
                badges.forEach(b => {
                    html += `<div class="badge-card earned"><div class="badge-icon">${b.icon || '\u2B50'}</div><div class="badge-name">${esc(b.name)}</div></div>`;
                });
                html += '</div>';
                el.innerHTML = html;
            } catch(e) { document.getElementById('tab-badges').innerHTML = '<div class="empty">Could not load badges.</div>'; }
        }

        async function completeItem(itemId) {
            if (!userName) { alert('Please complete onboarding first.'); return; }
            try {
                const res = await fetch('/api/explore/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ participant_name: userName, item_id: itemId }),
                });
                if (res.ok) {
                    loadBadges();
                    loadCatalog();
                }
            } catch(e) {}
        }

        loadCulture();
        loadCatalog();
        loadBadges();
    </script>
</body>
</html>
